[env:s3-ull-link]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.f_flash = 40000000L
monitor_speed = 115200
build_flags =
    -Wl,--wrap=r_llm_le_features_get_hack
    -Wl,--wrap=r_lld_llcp_rx_ind_handler_hack
    -Wl,--wrap=r_hci_register_vendor_desc_tab_hack
    -Wl,--wrap=r_register_esp_vendor_cmd_handler_hack
    -Wl,--wrap=r_ble_util_buf_llcp_tx_free
    -Wl,--wrap=r_lld_con_llcp_tx
    -Wl,--wrap=r_sch_prog_ble_push_hack
